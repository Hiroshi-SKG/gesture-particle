<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090f">
  <meta name="description" content="手の動きで光の粒子を操るインタラクティブアート。">
  <title>Gesture Particle</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><h1>Gesture <span>Particle</span></h1></div>
    <div class="status" id="status" role="status" data-state="idle"><span></span><strong id="status-label">待機中</strong></div>
  </header>
  <main class="stage">
    <div id="art" class="art" aria-hidden="true"></div>
    <div class="stage-label"><span aria-hidden="true"></span> PARTICLE FIELD</div>
    <div class="corner top-left" aria-hidden="true"></div>
    <div class="corner top-right" aria-hidden="true"></div>
    <div class="corner bottom-left" aria-hidden="true"></div>
    <div class="corner bottom-right" aria-hidden="true"></div>
    <aside class="preview" aria-label="カメラプレビュー">
      <video id="preview" autoplay muted playsinline aria-label="カメラ映像"></video>
      <div class="preview-empty" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 5-3v10l-5-3"/></svg>
        <span>カメラはオフ</span>
      </div>
      <div class="preview-label" aria-hidden="true"><i></i> CAMERA</div>
    </aside>
    <div class="controls">
      <p id="error" role="alert" hidden></p>
      <button id="camera" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 5-3v10l-5-3"/></svg>
        <span>カメラを開始</span>
      </button>
      <p>手を動かして、光を操る。</p>
    </div>
  </main>
  <footer>
    <div class="gestures"><span><b aria-hidden="true">↔</b> 動かす <small>追従</small></span><span><b aria-hidden="true">✧</b> 開く <small>拡散</small></span><span><b aria-hidden="true">◇</b> 握る <small>収束</small></span></div>
    <div class="privacy">カメラ映像は端末内で処理</div>
  </footer>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
